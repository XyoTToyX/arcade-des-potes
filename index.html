/* ---------- Bots ---------- */
function botOptions(s,cur){
 var o=[],others=s.players.filter(function(p){return p.alive&&p.id!==cur.id&&p.hand.length});
 SIMPLE.forEach(function(t){if(cur.hand.indexOf(t)>=0)o.push({type:t})});
 var liv=s.players.filter(function(p){return p.alive&&p.id!==cur.id});
 if(liv.length&&cur.hand.indexOf('target')>=0)o.push({type:'target',target:pick(liv).id});
 if(others.length&&cur.hand.indexOf('favor')>=0)o.push({type:'favor',target:pick(others).id});
 CATS.forEach(function(c){if(others.length&&cnt(cur.hand,c)>=2)o.push({type:c,count:2,target:pick(others).id})});
 return o;
}
function botStep(){
 var s=S;if(!s)return;
 var gk=gameOf(s);
 if(gk!=='eddy'){
  if(s.phase==='over')return;
  if(gk==='hockey')return;   /* l'air hockey tourne en temps réel, pas au tour par tour */
  if(gk==='uno')return uBot(s);
  if(gk==='yams')return yBot(s);
  if(gk==='quiestce')return qBot(s);
  if(gk==='morpion')morBot(s);else if(gk==='p4')c4Bot(s);else if(gk==='navale')navBot(s);else pkBot(s);
  return;
 }
 if(s.phase!=='play')return;
 var p;
 if(Date.now()<ui.busyUntil){schedBot();return}
 if(s.defuse){p=P(s,s.defuse.pid);if(p.bot){var n=s.draw.length,pos=Math.random()<.5?Math.floor(Math.random()*(n+1)):n;mutate(function(x){reinsert(x,pos)})}return}
 if(s.fav){p=P(s,s.fav.from);if(p.bot){var opts=p.hand.filter(function(c){return c!=='defuse'});var give=pick(opts.length?opts:p.hand);mutate(function(x){giveFav(x,give)})}return}
 if(s.alter){p=P(s,s.alter.pid);if(p.bot){var k=s.alter.cards.length,o=[];for(var q=0;q<k;q++)o.push(q);shuffle(o);mutate(function(x){applyAlter(x,o)})}return}
 if(s.peek){if(P(s,s.peek.pid).bot)mutate(function(x){x.peek=null});return}
 if(s.pending){
  var pd=s.pending;if(Date.now()>pd.deadline-300)return;
  if(pd.locked)return;
  for(var i=0;i<s.players.length;i++){
   var b=s.players[i];if(!b.bot||!b.alive||b.hand.indexOf('nope')<0)continue;
   var key=pd.id+':'+pd.nopes+':'+b.id;if(decided[key])continue;decided[key]=1;
   var hit=pd.target===b.id||((pd.type==='attack')&&s.players[nextIdx(s,s.turn)].id===b.id);
   var pr=hit?.7:.12;
   if(pd.by===b.id)pr=(pd.nopes%2===1)?.6:0;
   if(Math.random()<pr){(function(id){mutate(function(x){doNope(x,id,'nope')})})(b.id);return}
  }
  return;
 }
 var cur=s.players[s.turn];if(!cur.bot)return;
 var ops=botOptions(s,cur);
 if(ops.length&&Math.random()<.4){var o=pick(ops);mutate(function(x){playCard(x,cur.id,o.type,o)});return}
 mutate(function(x){drawCard(x)});
}
function schedBot(){
 clearTimeout(botT);
 if(!S||!isHost())return;
 if(gameOf(S)==='eddy'?S.phase!=='play':(S.phase!=='play'&&S.phase!=='place'))return;
 var wait=Math.max(0,ui.busyUntil-Date.now());
 botT=setTimeout(botStep,wait+900+Math.random()*700);
}

/* ================= CHAT ÉPHÉMÈRE =================
   Rien n'est enregistré : les messages vivent en mémoire, chez ceux qui sont
   connectés au moment où ils passent, et disparaissent au rechargement. */
var CHAT={lobby:[],room:[]};
function chatKey(){return (S&&mode==='online'&&S.code)?('room:'+S.code):'lobby'}
function chatList(){return chatKey()==='lobby'?CHAT.lobby:CHAT.room}
function chatPush(where,m){
 var arr=where==='lobby'?CHAT.lobby:CHAT.room;
 /* Chaque message porte un identifiant : si le canal nous le renvoie (écho de
    notre propre envoi, ou double réception), on ne l'affiche pas deux fois. */
 if(m.id&&arr.some(function(x){return x.id===m.id}))return;
 arr.push(m);while(arr.length>40)arr.shift();
}
function chatSend(){
 ui.chatDraft='';
 var inp=document.getElementById('chatin');
 var txt=String((inp&&inp.value)||'').trim().slice(0,140);
 if(!txt)return;
 if(inp)inp.value='';
 var scope=chatKey();
 var m={id:me.key+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),n:myName(),u:me.key,t:txt,at:Date.now()};
 chatPush(scope==='lobby'?'lobby':'room',m);
 if(room){
  emit({k:'chat',scope:scope,m:m});
  /* doublé par la présence : un joueur en lecture seule ne peut pas émettre,
     mais il peut toujours publier sa présence — son message passe quand même. */
  room.presence({cm:{id:m.id,n:m.n,u:m.u,t:m.t,s:scope}}).catch(function(){});
 }else toast('Le chat a besoin de la connexion en direct.');
 render();
}
function onChat(d){
 if(!d||!d.m||typeof d.m.t!=='string')return;
 if(d.m.u===me.key&&d.m.id&&chatList().some(function(x){return x.id===d.m.id}))return;
 var scope=String(d.scope||'lobby');
 if(scope!=='lobby'&&scope!=='room:'+(S&&S.code))return;
 chatPush(scope==='lobby'?'lobby':'room',{id:String(d.m.id||''),n:String(d.m.n||'?').slice(0,14),u:String(d.m.u||''),t:d.m.t.slice(0,140),at:Date.now()});
 if(scope===chatKey()){sfx('msg');render()}

function chatScan(){

 var peers=room.peers()||[],changed=false;

  var scope=String(cm.s||'lobby');

  var arr=scope==='lobby'?CHAT.lobby:CHAT.room;

  chatPush(scope==='lobby'?'lobby':'room',{id:String(cm.id),n:String(cm.n||'?').slice(0,14),u:String(cm.u||''),t:String(cm.t).slice(0,140),at:Date.now()});

var YROLL=null;
function fxYamsRoll(e){
 if(YROLL){clearInterval(YROLL.t);YROLL=null}
 var held=(S&&S.g&&S.g.held)||[false,false,false,false,false];
 var tumbling=[];
 for(var i=0;i<5;i++){
  var el2=document.getElementById('ydie-'+i);
  if(!el2)continue;
  if(held[i]&&e.n>1)continue;
  tumbling.push({i:i,el:el2});
  if(el2.classList&&el2.classList.add)el2.classList.add('tumble');
 }
 if(!tumbling.length)return;
 shake(6);
 var ticks=0,faces=['⚀','⚁','⚂','⚃','⚄','⚅'],id=null;
 /* l'identifiant est gardé en local : un nouveau lancer ne casse pas l'ancien minuteur */
 id=setInterval(function(){
  ticks++;
  tumbling.forEach(function(d){
   var sp=d.el.querySelector&&d.el.querySelector('span');
   if(sp)sp.textContent=faces[Math.floor(Math.random()*6)];
  });
  if(ticks%2===0)sfx('dice');
  if(ticks>=11){
   clearInterval(id);if(YROLL&&YROLL.t===id)YROLL=null;
   tumbling.forEach(function(d,k){
    var sp=d.el.querySelector&&d.el.querySelector('span');
    if(sp&&e.dice)sp.textContent=faces[(e.dice[d.i]||1)-1];
    if(d.el.classList){d.el.classList.remove('tumble');d.el.classList.add('landed')}
    if(d.el.animate)d.el.animate([{transform:'scale(1.25) rotate(-8deg)'},{transform:'scale(.95)'},{transform:'none'}],{duration:280,delay:k*40});
   });
   sfx('chip');
  }
 },55);
 YROLL={t:id};
}

 unsub=ref.onSnapshot(function(snap){
  if(!snap.exists){if(S){toast('La salle a disparu.');leave()}return}
  applyRemote(clone(snap.data()));

function makeCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ',c='';for(var i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
function createRoom(tries){
 if(!db)return;
 var code=makeCode();
 var r=db.doc('games/'+code);
 r.get().then(function(snap){
  if(snap.exists&&(tries||0)<4)return createRoom((tries||0)+1);
  ref=r;mode='online';roomCode=code;ui.invite=null;ui.evtSeen=0;S=baseState(code);
  return r.set(S).then(function(){subscribe();render()});
 }).catch(function(){toast('Impossible de créer la salle.')});
}
function joinCode(code){
 if(!db){toast('Le mode en ligne n\'est pas disponible ici.');return}
 code=String(code||'').trim().toUpperCase();
 if(!/^[A-Z]{4}$/.test(code)){toast('Le code fait 4 lettres.');return}
 var r=db.doc('games/'+code);
 r.get().then(function(snap){
  if(!snap.exists){toast('Aucune salle avec ce code.');return}
  var d=snap.data();
  var inside=d.players.some(sameSeat);
  var full=d.players.length>=gmax(d);
  if(!inside&&(d.phase!=='lobby'||full)){
   /* Pas de place : on entre en spectateur, sans toucher à la partie. */
   ref=r;mode='online';roomCode=code;ui.invite=null;wantJoin=false;ui.spectator=true;
   S=clone(d);ui.evtSeen=d.eid||0;subscribe();render();
   emit({k:'ping',code:code});
   toast(d.phase!=='lobby'?'Partie en cours : tu regardes.':'Salle pleine : tu regardes.');
   return;
  }
  ui.spectator=false;
  ref=r;mode='online';roomCode=code;ui.invite=null;wantJoin=true;S=null;subscribe();startJoinLoop();
 }).catch(function(){toast('Impossible de rejoindre.')});
}

 acctnext:function(){
  var n=document.getElementById('name'),v=String(n&&typeof n.value==='string'?n.value:(ui.nameDraft||'')).trim().slice(0,14);
  if(v.length<2){ui.pinMsg='Ton pseudo doit faire au moins 2 caractères.';render();return}
  var k=slug(v);
  if(!k){ui.pinMsg='Ce pseudo ne passe pas, essaie avec des lettres.';render();return}
  if(findAcct(k)){ui.pinMsg='Ce pseudo est déjà pris, choisis-en un autre.';render();return}
  ui.pinName=v;ui.pinFor=k;ui.pin='';ui.pin1='';ui.pinMsg='';ui.pinStage='new1';ui.screen='pin';render();
 },
 pinopen:function(d){
  ui.pinFor=d.k;ui.pin='';ui.pinMsg='';ui.pinStage='login';ui.screen='pin';render();
 },
 pinback:function(){
  var st=ui.pinStage;
  ui.pin='';ui.pinMsg='';ui.pinStage='';
  ui.screen=(ui.screen==='pin'&&(st==='new1'||st==='new2'))?'create':'login';
  render();
 },
 pindel:function(){ui.pin=ui.pin.slice(0,-1);ui.pinMsg='';render()},
 pindig:function(d){
  if(ui.pinBusy||ui.pin.length>=4)return;
  ui.pin+=String(d.d).slice(0,1);ui.pinMsg='';
  if(ui.pin.length===4)pinDone();else render();
 },
 cancelname:function(){ui.nameDraft=null;ui.pin='';ui.screen=me.key?'home':'login';render()},
 rename:function(){
  if(S){toast('Quitte d\'abord ta partie.');return}
  logout();ui.screen='login';ui.pin='';lastPres='';lastLob='';render();
 },
 noinv:function(){ui.invite=null;render()},
 localsetup:function(){ui.screen='localsetup';render()},
 startlocal:function(d){startLocal(parseInt(d.n,10))},
 localpack:function(d){if(PACKS[d.p]){sset('eb_pack',d.p);render()}},
 home:function(){if(S)leave();else{ui.screen='home';render()}},
 create:function(){createRoom(0)},
 join:function(){var c=document.getElementById('joincode');joinCode(c&&typeof c.value==='string'?c.value:ui.codeDraft)},
 joinc:function(d){joinCode(d.code)},
 invite:function(d){
  if(!room||!S)return;
  room.emit('eb',{k:'invite',code:S.code,to:d.id,from:myName()}).then(function(){toast('Invitation envoyée à '+d.n)}).catch(function(e){sendFail(e);toast('Invitation impossible.')});
 },
 addbot:function(){if(S.players.length<gmax(S))mutate(function(s){addBot(s)})},
 start:function(){
  var g=GAMEINFO[gameOf(S)];
  if(S.players.length<g.min){toast('Il faut au moins '+g.min+' joueurs.');return}
  if(S.players.length>g.max){toast(g.n+' se joue à '+g.max+' maximum.');return}
  ui.busyUntil=0;mutate(function(s){startGame(s)});
 },
 setgame:function(d){
  if(!S||!isHost()||S.phase!=='lobby'||!GAMEINFO[d.k])return;
  sset('eb_game',d.k);
  mutate(function(s){
   s.game=d.k;
   var mx=GAMEINFO[d.k].max;
   while(s.players.length>mx){
    var bi=-1;for(var i=s.players.length-1;i>=0;i--)if(s.players[i].bot){bi=i;break}
    if(bi<0)break;s.players.splice(bi,1);
   }
  });
 },
 localgame:function(d){if(GAMEINFO[d.k]){sset('eb_game',d.k);render()}},
 endgame:function(){
  if(!isHost()||!S||S.phase==='lobby')return;
  if(HK)hkClear();
  HK=null;
  if(ui.confirmEnd!==S.code){ui.confirmEnd=S.code;toast('Appuie encore pour ramener tout le monde au salon.');return}
  ui.confirmEnd=null;ui.navShips=[];ui.busyUntil=0;ui.overKey=null;
  mutate(function(s){
   s.phase='lobby';s.g=null;s.winner=null;s.evt=null;
   s.pending=null;s.fav=null;s.defuse=null;s.peek=null;s.alter=null;
   s.players.forEach(function(p){p.hand=[];p.alive=true});
   say(s,'L\'hôte a ramené tout le monde au salon.');
  });
 },
 again:function(){
  if(gameOf(S)!=='eddy'){ui.navShips=[];HK=null;mutate(function(s){startGame(s)});return}
  if(mode==='local'){startLocal(ui.lastBots);return}
  mutate(function(s){s.phase='lobby';s.pending=null;s.fav=null;s.defuse=null;s.peek=null;s.alter=null;s.dir=1;s.winner=null;s.evt=null;s.players.forEach(function(p){p.hand=[];p.alive=true})});
 },
 card:function(d){ui.sheet=d.t;ui.sheetIn=true;render()},
 closesheet:function(){ui.sheet=null;render()},
 rules:function(){ui.rules=true;ui.rulesFor=S?gameOf(S):'eddy';ui.rulesBack=false;render()},
 closerules:function(){ui.rules=false;ui.rulesBack=false;render()},
 settings:function(){ui.settings='main';ui.rules=false;render()},
 setmenu:function(d){ui.settings=d.m;render()},
 closeset:function(){ui.settings=null;render()},
 openrules:function(d){ui.settings=null;ui.rules=true;ui.rulesFor=d.k;ui.rulesBack=true;render()},
 chatsend:function(){chatSend()},
 sound:function(){sndOn=!sndOn;sset('eb_snd',sndOn?'1':'0');if(sndOn)sfx('win');render()},
 play:function(d){if(!canPlay())return;ui.sheet=null;mutate(function(s){playCard(s,me.id,d.t,{})})},
 playt:function(d){
  if(!canPlay())return;
  var o={count:parseInt(d.count,10),target:d.target};
  if(d.named)o.named=ui.named;
  ui.sheet=null;mutate(function(s){playCard(s,me.id,d.t,o)});
 },
 named:function(d){ui.named=d.t;render()},
 draw:function(){if(!canPlay())return;mutate(function(s){drawCard(s)})},
 nope:function(){
  var my=P(S,me.id);
  if(S.pending&&!S.pending.locked&&my&&my.alive&&my.hand.indexOf('nope')>=0)mutate(function(s){doNope(s,me.id,'nope')});
 },
 snope:function(){
  var my=P(S,me.id);
  if(S.pending&&!S.pending.locked&&my&&my.alive&&my.hand.indexOf('supernope')>=0)mutate(function(s){doNope(s,me.id,'supernope')});
 },
 altpick:function(d){
  if(!S.alter||S.alter.pid!==me.id)return;
  var i=parseInt(d.i,10),k=S.alter.cards.length;
  if(!ui.alterOrd||ui.alterOrd.length!==k)ui.alterOrd=S.alter.cards.map(function(_,x){return x});
  if(ui.altSel===null||ui.altSel===undefined)ui.altSel=i;
  else if(ui.altSel===i)ui.altSel=null;
  else{var t=ui.alterOrd[i];ui.alterOrd[i]=ui.alterOrd[ui.altSel];ui.alterOrd[ui.altSel]=t;ui.altSel=null}
  render();
 },
 altok:function(){
  if(!S.alter||S.alter.pid!==me.id)return;
  var o=ui.alterOrd;ui.alterOrd=null;ui.altSel=null;
  mutate(function(s){applyAlter(s,o)});
 },
 setpack:function(d){
  if(!S||!isHost()||S.phase!=='lobby')return;
  if(!PACKS[d.p])return;
  sset('eb_pack',d.p);mutate(function(s){s.pack=d.p});
 },
 reins:function(d){
  if(!S.defuse||S.defuse.pid!==me.id)return;
  var pos=parseInt(d.pos,10);
  mutate(function(s){if(pos<0)pos=Math.floor(Math.random()*(s.draw.length+1));reinsert(s,pos)});
 },
 give:function(d){if(S.fav&&S.fav.from===me.id)mutate(function(s){giveFav(s,d.t)})},
 qmode:function(d){
  if(gameOf(S)!=='quiestce')return;
  ui.qSel=null;
  ui.qMode=(ui.qMode===d.m)?null:d.m;
  render();
 },
 qclose:function(){ui.qMode=null;ui.qSel=null;render()},
 qask:function(d){
  if(gameOf(S)!=='quiestce')return;
  ui.qMode=null;sfx('click');
  mutate(function(s){qAsk(s,me.id,d.k)});
 },
 qpick:function(d){if(gameOf(S)==='quiestce'){ui.qSel=parseInt(d.i,10);render()}},
 qconfirm:function(){
  if(gameOf(S)!=='quiestce'||ui.qSel===null||ui.qSel===undefined)return;
  var i=ui.qSel;ui.qSel=null;ui.qMode=null;
  mutate(function(s){qGuess(s,me.id,i)});
 },
 uplay:function(d){
  if(gameOf(S)!=='uno')return;
  var i=parseInt(d.i,10),hand=S.g.hands[me.id]||[];
  if(!hand[i]||!uPlayable(S,hand[i]))return;
  sfx('card');mutate(function(s){uPlay(s,me.id,i,null)});
 },
 ucol:function(d){if(gameOf(S)==='uno')mutate(function(s){uPickColor(s,me.id,d.c)})},
 udraw:function(){if(gameOf(S)==='uno'){sfx('card');mutate(function(s){uDraw(s,me.id)})}},
 upass:function(){if(gameOf(S)==='uno')mutate(function(s){uPass(s,me.id)})},
 yroll:function(){if(gameOf(S)==='yams'){sfx('dice');mutate(function(s){yRoll(s,me.id)})}},
 yhold:function(d){if(gameOf(S)==='yams'){sfx('click');mutate(function(s){yHold(s,me.id,parseInt(d.i,10))})}},
 ypick:function(d){if(gameOf(S)==='yams')mutate(function(s){yPick(s,me.id,d.c)})},
 mor:function(d){if(gameOf(S)==='morpion')mutate(function(s){morPlay(s,me.id,parseInt(d.i,10))})},
 mornext:function(){if(gameOf(S)==='morpion'&&S.g.res!==null)mutate(function(s){morStart(s)})},
 c4:function(d){if(gameOf(S)==='p4'){sfx('drop');mutate(function(s){c4Play(s,me.id,parseInt(d.c,10))})}},
 c4next:function(){if(gameOf(S)==='p4'&&S.g.res!==null)mutate(function(s){c4Start(s)})},
 navrot:function(){
  var sel=ui.navSel,ships=ui.navShips||[];
  if(sel!==null&&sel!==undefined&&ships[sel]){
   var sh=ships[sel],others=ships.filter(function(_,k){return k!==sel});
   var nd=sh.d?0:1;
   if(navFits(others,sh.r,sh.c,sh.l,nd))sh.d=nd;
   else{
    /* on essaie de le recaler pour qu'il tienne dans la grille */
    var ok=false;
    for(var off=1;off<sh.l&&!ok;off++){
     var nr=nd===1?Math.max(0,sh.r-off):sh.r,nc=nd===0?Math.max(0,sh.c-off):sh.c;
     if(navFits(others,nr,nc,sh.l,nd)){sh.r=nr;sh.c=nc;sh.d=nd;ok=true}
    }
    if(!ok)toast('Pas la place de tourner ici.');
   }
  }else ui.navDir=!ui.navDir;
  render();
 },
 navrand:function(){ui.navShips=navRandom();ui.navSel=null;render()},
 navclear:function(){ui.navShips=[];ui.navSel=null;render()},
 navpick:function(d){
  var k=parseInt(d.k,10);
  ui.navSel=(ui.navSel===k)?null:k;
  render();
 },
 navunsel:function(){ui.navSel=null;render()},
 navput:function(d){
  var ships=ui.navShips||[],r=parseInt(d.r,10),c=parseInt(d.c,10);
  var sel=ui.navSel;
  if(sel!==null&&sel!==undefined&&ships[sel]){
   var sh=ships[sel],others=ships.filter(function(_,k){return k!==sel});
   if(!navFits(others,r,c,sh.l,sh.d))return;
   sh.r=r;sh.c=c;ui.navSel=null;ui.navShips=ships;render();return;
  }
  var next=FLEET[ships.length];
  if(!next)return;
  var dir=ui.navDir?1:0;
  if(!navFits(ships,r,c,next.l,dir))return;
  ships.push({r:r,c:c,l:next.l,d:dir,i:ships.length});ui.navShips=ships;render();
 },
 navready:function(){
  var ships=ui.navShips||[];
  if(ships.length!==FLEET.length)return;
  ui.navSel=null;
  mutate(function(s){navSet(s,me.id,ships)});
 },
 navfire:function(d){mutate(function(s){navFire(s,me.id,parseInt(d.r,10),parseInt(d.c,10))})},
 pk:function(d){
  if(gameOf(S)!=='poker')return;
  var g=S.g;
  if(d.w==='allin')mutate(function(s){pkAct(s,me.id,'raise',s.g.bet[me.id]+s.g.chips[me.id])});
  else if(d.w==='raise')mutate(function(s){pkAct(s,me.id,'raise',s.g.toCall+s.g.minRaise)});
  else mutate(function(s){pkAct(s,me.id,d.w)});
 },
 pknew:function(){if(gameOf(S)==='poker'&&S.g.show&&isHost())mutate(function(s){pkNewHand(s)})},
 peekok:function(){if(S.peek&&S.peek.pid===me.id)mutate(function(s){s.peek=null})}
};
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;
 sfx('click');
 if(el.classList.contains('veil')&&e.target!==el)return;
 var f=ACT[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('keydown',function(e){
 if(e.key!=='Enter')return;
 var id=e.target&&e.target.id;
 if(id==='name')ACT.acctnext();else if(id==='joincode')ACT.join();else if(id==='chatin')chatSend();
});

/* ---------- Démarrage ---------- */
render();
if(window.claude&&window.claude.use){
 window.claude.use('room').then(function(r){
  if(!r)return;
  room=r;
  room.on('eb',onRoomMsg,function(){});
  room.onPeers(function(){chatScan();refreshLists()},function(){});
  lastPres='';syncPresence();
  if(!S)render();
 }).catch(function(){});
 window.claude.use('db').then(function(d){db=d;acctWatch();lobbyWatch();if(!S)render()}).catch(function(){});
 document.addEventListener('visibilitychange',function(){if(!document.hidden){lobbyWrite(true);poll();hkKick()}});
 setInterval(hkKick,1200);
}
})();
</script>
</body>
</html>
